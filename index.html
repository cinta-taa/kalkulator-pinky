<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator UI/UX PPLG</title>
    <style>
        /* ============================ */
        /* BAGIAN CSS (DESAIN TAMPILAN) */
        /* ============================ */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* UI/UX Constraint: Background Gradasi yang menarik */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px; 
            /* UI/UX Constraint: Efek shadow (bayangan) yang lembut dan elegan */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15); 
            width: 260px;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #fff0f5; 
            border: 2px solid #f8bbd0;
            border-radius: 15px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            color: #880e4f; 
            font-weight: bold;
            /* Shadow kecil di bagian dalam layar */
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px; 
        }

        button {
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px; 
            background-color: #f8bbd0; 
            color: #d81b60; 
            cursor: pointer;
            /* UI/UX Constraint: Transisi halus untuk efek hover */
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(248, 187, 208, 0.5);
        }

        /* UI/UX Constraint: Efek hover interaktif (Tombol terangkat & warna berubah) */
        button:hover {
            background-color: #f48fb1;
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 8px 12px rgba(244, 143, 177, 0.6);
        }

        /* Tombol saat diklik (efek ditekan ke dalam) */
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 4px rgba(244, 143, 177, 0.6);
        }

        .btn-operator {
            background-color: #f06292;
            color: white;
            box-shadow: 0 4px 6px rgba(240, 98, 146, 0.5);
        }

        .btn-operator:hover {
            background-color: #e91e63;
            box-shadow: 0 8px 12px rgba(233, 30, 99, 0.6);
        }

        .btn-clear {
            background-color: #ffb7b2;
            color: white;
            grid-column: span 2; 
            box-shadow: 0 4px 6px rgba(255, 183, 178, 0.5);
        }

        .btn-clear:hover {
            background-color: #ff9caa;
            box-shadow: 0 8px 12px rgba(255, 156, 170, 0.6);
        }

        .btn-equal {
            background-color: #ce93d8;
            color: white;
            grid-row: span 2; 
            height: 112px;
            box-shadow: 0 4px 6px rgba(206, 147, 216, 0.5);
        }

        .btn-equal:hover {
            background-color: #ba68c8;
            box-shadow: 0 8px 12px rgba(186, 104, 200, 0.6);
        }

        .btn-zero {
            grid-column: span 2; 
        }
    </style>
</head>
<body>

    <!-- ============================ -->
    <!-- BAGIAN HTML (KERANGKA WEB)   -->
    <!-- ============================ -->
    <div class="calculator">
        <input type="text" id="display" disabled value="0">
        
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-operator" onclick="setOperator('/')">/</button>
            <button class="btn-operator" onclick="setOperator('*')">x</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="setOperator('-')">-</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="setOperator('+')">+</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-equal" onclick="calculate()">=</button>

            <button class="btn-zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <!-- ============================ -->
    <!-- BAGIAN JS (LOGIKA PROGRAM)   -->
    <!-- ============================ -->
    <script>
        const display = document.getElementById('display');
        let currentInput = '0';
        let previousInput = '';
        let currentOperator = '';

        function appendNumber(number) {
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function setOperator(operator) {
            if (currentInput === '') return; 
            if (previousInput !== '') {
                calculate();
            }
            currentOperator = operator;
            previousInput = currentInput;
            currentInput = '';
        }

        function calculate() {
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            let result = 0;
            switch (currentOperator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    if (current === 0) {
                        alert("Tidak bisa dibagi dengan nol!");
                        clearDisplay();
                        return;
                    }
                    result = prev / current; 
                    break;
                default: return;
            }

            currentInput = result.toString();
            currentOperator = '';
            previousInput = '';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            currentOperator = '';
            updateDisplay();
        }

        function updateDisplay() {
            display.value = currentInput;
        }
    </script>
</body>
</html>
